# Local development override - adds back the host port publishing that
# docker-compose.yml deliberately omits (see its comments). Not used in
# prod (see docker-compose.prod.yml instead).
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml <cmd>
# (apps/backend/Makefile's $(COMPOSE) already does this.)

services:
  backend:
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # Mounts POST /api/v1/auth/dev-login (see AuthEndpoints.Routes) - a
      # local-only stand-in for Google sign-in so several test accounts can
      # be logged into at once in separate tabs. Deliberately only set here,
      # never in docker-compose.yml/.prod.yml - config.Load also refuses to
      # boot if this is ever true alongside a prod-shaped
      # AUTH_COOKIE_SECURE/CORS_ALLOWED_ORIGINS. Set DEV_AUTH_BYPASS=false in
      # your local .env to opt back out.
      DEV_AUTH_BYPASS: "${DEV_AUTH_BYPASS:-true}"
      # Local dev's R2 bucket is the same bucket prod uses (so seeded
      # catalog images render without copying files - see
      # ObsidianVault/catalog-seed-from-prod.md). Deletes must therefore be
      # disabled here: a local delete must never remove an object prod
      # still serves. Never set in docker-compose.yml/.prod.yml.
      STORAGE_DISABLE_DELETE: "${STORAGE_DISABLE_DELETE:-true}"
      # Read by goose's ENVSUB at migration-apply time (not by compose) -
      # db/migrations/00017_seed_catalog_*.sql onwards gate their full
      # catalogue insert on this. Only ever true here and in
      # docker-compose.test.yml; prod always gets the translations-only
      # path (see that migration's own comment).
      SEED_CATALOG_FULL: "${SEED_CATALOG_FULL:-true}"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    build:
      args:
        # Renders the /dev-login screen - see backend's DEV_AUTH_BYPASS just
        # above. Dev-only for the same reason.
        EXPO_PUBLIC_DEV_AUTH: "${EXPO_PUBLIC_DEV_AUTH:-true}"
