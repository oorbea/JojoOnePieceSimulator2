name: JojoOnePieceSimulator

networks:
  public-net:
    external: true

services:
  postgres:
    container_name: jojo-one-piece-simulator-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see deployments/.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deployments/.env.example}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required, see deployments/.env.example}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - public-net
    restart: unless-stopped
    healthcheck:
      # Reads POSTGRES_USER/POSTGRES_DB from the container's own environment
      # (set above), not from host-side interpolation.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: jojo-one-piece-simulator-redis
    image: redis:8-alpine
    networks:
      - public-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: jojo-one-piece-simulator-backend
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.backend
    # Single source of truth for all backend vars in the Docker context - see
    # deployments/.env.example. Optional so `docker compose` still works in CI,
    # where GitHub Actions sets these as real environment variables instead.
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides the .env value (meant for host-side `go run`, where
      # Postgres is reached via localhost) so the containerized backend
      # reaches Postgres by its service name on the compose network instead.
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required, see deployments/.env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see deployments/.env.example}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required, see deployments/.env.example}?sslmode=disable
      # Same reasoning as DATABASE_URL above: reach Redis by its compose
      # service name instead of the .env's host-side localhost value.
      REDIS_URL: redis://redis:6379
      # Without this the backend denies every browser origin by default (see
      # apps/backend/internal/config/config.go) — the frontend service below
      # is the origin that needs allowing.
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    # No `ports:` here on purpose - see docker-compose.dev.yml/.prod.yml.
    # Compose merges (not replaces) port lists across override files, so a
    # port published here could never be removed by an override; publishing
    # only lives in docker-compose.dev.yml, prod reaches this service by name
    # inside public-net (e.g. via the reverse proxy).
    networks:
      - public-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Used by the CD pipeline to wait for the new container before
      # considering the deploy successful. busybox wget ships in the alpine
      # runtime image (deployments/docker/Dockerfile.backend).
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-8080}/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    container_name: jojo-one-piece-simulator-frontend
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend
      args:
        # EXPO_PUBLIC_* vars are inlined into the client bundle at build
        # time, so they have to be passed as build args, not env/env_file.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:${PORT:-8080}/api/v1}
        EXPO_PUBLIC_SOCKET_URL: ${EXPO_PUBLIC_SOCKET_URL:-}
        EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-}
        EXPO_PUBLIC_BUILD_ID: ${EXPO_PUBLIC_BUILD_ID:-dev}
    # No `ports:` here either - see the backend service comment above.
    networks:
      - public-net
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres-data:
