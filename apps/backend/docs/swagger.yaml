  /users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Admin only. An admin cannot change their own role through this
        route (use another admin account), and the last remaining admin cannot be
        demoted. A role change only takes effect on the affected user's next login,
        since the role is carried in the JWT. ADMIN_EMAILS re-promotes a listed email
        on every login, so demoting one of those emails is temporary.
