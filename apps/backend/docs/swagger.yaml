basePath: /api/v1
definitions:
  dto.AdminUpdateUserRequest:
    properties:
      username:
        type: string
    type: object
  dto.CreateGameRequest:
    properties:
      abilitySource:
        type: string
      allowBots:
        type: boolean
      mangas:
        items:
          type: string
        type: array
      mode:
        type: string
      poolFilter:
        $ref: '#/definitions/dto.PoolFilterPayload'
      teamSize:
        type: integer
      visibility:
        type: string
      votingWindowSeconds:
        type: integer
    type: object
  dto.DevilFruitRequest:
    properties:
      fruitType:
        type: string
      name:
        type: string
      rarity:
        type: string
      translations:
        additionalProperties:
          $ref: '#/definitions/dto.TranslationRequest'
        type: object
    type: object
  dto.DevilFruitResponse:
    properties:
      description:
        type: string
      fruitType:
        type: string
      id:
        type: string
      name:
        type: string
      picture:
        type: string
      pictureStatus:
        type: string
      pictureThumb:
        type: string
      rarity:
        type: string
      skills:
        items:
          type: string
        type: array
    type: object
  dto.ErrorResponse:
    properties:
      code:
        type: string
      details:
        items:
          type: string
        type: array
      error:
        type: string
    type: object
  dto.GameConfigResponse:
    properties:
      abilitySource:
        type: string
      allowBots:
        type: boolean
      mangas:
        items:
          type: string
        type: array
      poolFilter:
        $ref: '#/definitions/dto.PoolFilterResponse'
      teamSize:
        type: integer
      visibility:
        type: string
      votingWindowSeconds:
        type: integer
    type: object
  dto.GameLoadoutResponse:
    properties:
      armamentHaki:
        type: string
      conquerorHaki:
        type: string
      devilFruit:
        $ref: '#/definitions/dto.DevilFruitResponse'
      fruitMastery:
        type: string
      hamon:
        type: string
      observationHaki:
        type: string
      physicalForm:
        type: string
      spin:
        type: string
      stand:
        $ref: '#/definitions/dto.StandResponse'
    type: object
  dto.GameParticipantResponse:
    properties:
      avatarThumb:
        type: string
      connected:
        type: boolean
      displayName:
        type: string
      id:
        type: string
      kind:
        type: string
      loadout:
        $ref: '#/definitions/dto.GameLoadoutResponse'
      teamId:
        type: string
      userId:
        type: string
    type: object
  dto.GameResultResponse:
    properties:
      aborted:
        type: boolean
      mode:
        type: string
      roundsPlayed:
        type: integer
      winner:
        type: string
    type: object
  dto.GameRoundResponse:
    properties:
      index:
        type: integer
      options:
        items:
          type: string
        type: array
      result:
        $ref: '#/definitions/dto.GameRoundResultResponse'
      stage:
        $ref: '#/definitions/dto.GameStageResponse'
      tiebreakUsed:
        type: boolean
      votedParticipantIds:
        items:
          type: string
        type: array
      votes:
        additionalProperties:
          type: string
        type: object
    type: object
  dto.GameRoundResultResponse:
    properties:
      decidedByCoinFlip:
        type: boolean
      winner:
        type: string
    type: object
  dto.GameSnapshotResponse:
    properties:
      code:
        type: string
      config:
        $ref: '#/definitions/dto.GameConfigResponse'
      hostId:
        type: string
      id:
        type: string
      locked:
        type: boolean
      mode:
        type: string
      participants:
        items:
          $ref: '#/definitions/dto.GameParticipantResponse'
        type: array
      result:
        $ref: '#/definitions/dto.GameResultResponse'
      revealEndsAt:
        description: |-
          RevealEndsAt is set (RFC3339) only while the game is ASSIGNING with a
          pending reveal - see NewGameStateResponse's deadlines param.
        type: string
      rounds:
        items:
          $ref: '#/definitions/dto.GameRoundResponse'
        type: array
      state:
        type: string
      teams:
        items:
          $ref: '#/definitions/dto.GameTeamResponse'
        type: array
      votingEndsAt:
        description: |-
          VotingEndsAt is set (RFC3339) only while the game is VOTING/TIEBREAK
          with a pending window - the deadline a client reconnecting mid-vote
          needs, since the VOTING_OPENED/TIEBREAK_OPENED frames that carry
          closesAt are one-shot and long gone by then.
        type: string
    type: object
  dto.GameStageResponse:
    properties:
      description:
        type: string
      id:
        type: string
      manga:
        type: string
      name:
        type: string
      order:
        type: integer
      picture:
        type: string
      pictureStatus:
        type: string
      pictureThumb:
        type: string
    type: object
  dto.GameStateResponse:
    properties:
      game:
        $ref: '#/definitions/dto.GameSnapshotResponse'
      you:
        $ref: '#/definitions/dto.GameViewerResponse'
    type: object
  dto.GameTeamResponse:
    properties:
      color:
        type: integer
      id:
        type: string
      memberIds:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  dto.GameViewerResponse:
    properties:
      hasVoted:
        type: boolean
      isHost:
        type: boolean
      participantId:
        type: string
      teamId:
        type: string
      vote:
        type: string
    type: object
  dto.GoogleLoginRequest:
    properties:
      idToken:
        type: string
    type: object
  dto.JoinGameRequest:
    properties:
      code:
        type: string
    type: object
  dto.LobbyPreviewResponse:
    properties:
      abilitySource:
        type: string
      allowBots:
        type: boolean
      code:
        type: string
      gameId:
        type: string
      hostDisplayName:
        type: string
      locked:
        type: boolean
      mangas:
        items:
          type: string
        type: array
      maxPlayers:
        type: integer
      mode:
        type: string
      playerCount:
        type: integer
      visibility:
        type: string
      votingWindowSeconds:
        type: integer
    type: object
  dto.LoginResponse:
    properties:
      accessToken:
        type: string
      expiresAt:
        type: string
      tokenType:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.PoolFilterPayload:
    properties:
      banned:
        items:
          type: string
        type: array
      fruitRarities:
        items:
          type: string
        type: array
      fruitTypes:
        items:
          type: string
        type: array
      standRarities:
        items:
          type: string
        type: array
    type: object
  dto.PoolFilterResponse:
    properties:
      banned:
        items:
          type: string
        type: array
      fruitRarities:
        items:
          type: string
        type: array
      fruitTypes:
        items:
          type: string
        type: array
      standRarities:
        items:
          type: string
        type: array
    type: object
  dto.PowerTranslationsResponse:
    properties:
      translations:
        additionalProperties:
          $ref: '#/definitions/dto.TranslationResponse'
        type: object
    type: object
  dto.PublicLobbyListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.PublicLobbyResponse'
        type: array
    type: object
  dto.PublicLobbyResponse:
    properties:
      abilitySource:
        type: string
      allowBots:
        type: boolean
      gameId:
        type: string
      hostDisplayName:
        type: string
      locked:
        type: boolean
      mangas:
        items:
          type: string
        type: array
      maxPlayers:
        type: integer
      mode:
        type: string
      playerCount:
        type: integer
      votingWindowSeconds:
        type: integer
    type: object
  dto.PublicUserResponse:
    properties:
      avatar:
        type: string
      avatarThumb:
        type: string
      completeName:
        type: string
      id:
        type: string
      username:
        type: string
    type: object
  dto.StageRequest:
    properties:
      manga:
        type: string
      name:
        type: string
      order:
        type: integer
      translations:
        additionalProperties:
          $ref: '#/definitions/dto.StageTranslationRequest'
        type: object
    type: object
  dto.StageResponse:
    properties:
      description:
        type: string
      id:
        type: string
      manga:
        type: string
      name:
        type: string
      order:
        type: integer
      picture:
        type: string
      pictureStatus:
        type: string
      pictureThumb:
        type: string
    type: object
  dto.StageTranslationRequest:
    properties:
      description:
        type: string
    type: object
  dto.StageTranslationResponse:
    properties:
      description:
        type: string
    type: object
  dto.StageTranslationsResponse:
    properties:
      translations:
        additionalProperties:
          $ref: '#/definitions/dto.StageTranslationResponse'
        type: object
    type: object
  dto.StandRequest:
    properties:
      attackPower:
        type: string
      attackRange:
        type: string
      endurance:
        type: string
      evolvesFromId:
        type: string
      name:
        type: string
      potential:
        type: string
      precision:
        type: string
      rarity:
        type: string
      speed:
        type: string
      translations:
        additionalProperties:
          $ref: '#/definitions/dto.TranslationRequest'
        type: object
    type: object
  dto.StandResponse:
    properties:
      attackPower:
        type: string
      attackRange:
        type: string
      description:
        type: string
      endurance:
        type: string
      evolvesFrom:
        $ref: '#/definitions/dto.StandResponse'
      id:
        type: string
      name:
        type: string
      picture:
        type: string
      pictureStatus:
        type: string
      pictureThumb:
        type: string
      potential:
        type: string
      precision:
        type: string
      rarity:
        type: string
      skills:
        items:
          type: string
        type: array
      speed:
        type: string
    type: object
  dto.TranslationRequest:
    properties:
      description:
        type: string
      skills:
        items:
          type: string
        type: array
    type: object
  dto.TranslationResponse:
    properties:
      description:
        type: string
      skills:
        items:
          type: string
        type: array
    type: object
  dto.UpdateConfigPayload:
    properties:
      abilitySource:
        type: string
      allowBots:
        type: boolean
      mangas:
        items:
          type: string
        type: array
      mode:
        type: string
      poolFilter:
        $ref: '#/definitions/dto.PoolFilterPayload'
      teamSize:
        type: integer
      visibility:
        type: string
      votingWindowSeconds:
        type: integer
    type: object
  dto.UpdateProfileRequest:
    properties:
      language:
        type: string
      username:
        type: string
    type: object
  dto.UpdateRoleRequest:
    properties:
      role:
        type: string
    type: object
  dto.UserResponse:
    properties:
      avatar:
        type: string
      avatarStatus:
        type: string
      avatarThumb:
        type: string
      completeName:
        type: string
      email:
        type: string
      id:
        type: string
      language:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for JojoOnePieceSimulator2 - Google-only auth, Stands and
    Devil Fruits catalogues.
  title: JojoOnePieceSimulator2 API
  version: "1.0"
paths:
  /auth/google:
    post:
      consumes:
      - application/json
      description: Verifies a Google ID token and returns an access token, creating
        the User the first time this Google account is seen.
      parameters:
      - description: Google ID token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: existing user logged in
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "201":
          description: new user registered
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Log in or register via Google
      tags:
      - auth
  /devil-fruits:
    get:
      description: |-
        Lists every DevilFruit, or filters them if any query param is set.
        Responses carry an ETag; a request with a matching If-None-Match
        gets 304 Not Modified with no body instead of the full list.
      parameters:
      - description: COMMON, RARE, EPIC, LEGENDARY, MYTHICAL
        in: query
        name: rarity
        type: string
      - description: PARAMECIA, ZOAN, LOGIA, SPECIAL_PARAMECIA, ANCIENT_ZOAN, MYTHICAL_ZOAN
        in: query
        name: fruitType
        type: string
      - description: free-text search over name and description
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DevilFruitResponse'
            type: array
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List or filter devil fruits
      tags:
      - devil-fruits
    post:
      consumes:
      - application/json
      description: Admin only.
      parameters:
      - description: Devil fruit to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DevilFruitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DevilFruitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a devil fruit
      tags:
      - devil-fruits
  /devil-fruits/{id}:
    delete:
      description: Admin only.
      parameters:
      - description: Devil fruit id (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a devil fruit
      tags:
      - devil-fruits
    get:
      description: |-
        The response carries an ETag; a request with a matching If-None-Match
        gets 304 Not Modified with no body instead of the full DevilFruit.
      parameters:
      - description: Devil fruit id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DevilFruitResponse'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a devil fruit by id
      tags:
      - devil-fruits
    put:
      consumes:
      - application/json
      description: Admin only. Keeps the original id.
      parameters:
      - description: Devil fruit id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Replacement devil fruit
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DevilFruitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DevilFruitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace a devil fruit
      tags:
      - devil-fruits
  /devil-fruits/{id}/picture:
    patch:
      consumes:
      - multipart/form-data
      description: |-
        Admin only. Uploads the image to object storage and stores its key; the response's `picture` is a presigned URL.
        The image is re-encoded to WebP by a background worker: the response is
        202 Accepted with `pictureStatus` set to PENDING and the previous
        `picture`/`pictureThumb` URLs (or "" on a first upload); poll GET
        /devil-fruits/{id} until `pictureStatus` becomes READY or FAILED.
      parameters:
      - description: Devil fruit id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Image file (WebP, AVIF, JPEG, PNG or GIF)
        in: formData
        name: picture
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dto.DevilFruitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set a devil fruit's picture
      tags:
      - devil-fruits
  /devil-fruits/{id}/translations:
    get:
      description: |-
        Admin only. Unlike GET /devil-fruits/{id}, always returns
        every locale's description/skills at once, for an edit form.
      parameters:
      - description: Devil fruit id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PowerTranslationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get every locale's translation for a devil fruit
      tags:
      - devil-fruits
  /games:
    post:
      consumes:
      - application/json
      description: Seats the caller as host in a new LOBBY. The response's `game.code`
        is the 6-character join code.
      parameters:
      - description: Game to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGameRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.GameStateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a game
      tags:
      - games
  /games/{id}:
    get:
      description: Only a seated participant may resume a game this way.
      parameters:
      - description: Game id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GameStateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a game by id
      tags:
      - games
  /games/{id}/config:
    patch:
      consumes:
      - application/json
      description: Host-only, LOBBY-only. Replaces the whole Config, exactly like
        POST /games's body.
      parameters:
      - description: Game id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: New configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateConfigPayload'
      produces:
      - application/json
      responses:
