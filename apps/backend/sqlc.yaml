version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/query"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "power_rarity"
            go_type: "string"
          - db_type: "stand_stat"
            go_type: "string"
          - db_type: "power_kind"
            go_type: "string"
