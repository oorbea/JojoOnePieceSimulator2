allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.15'
  - '@expo/config@58.0.8'
  - '@expo/local-build-cache-provider@58.0.8'
  - '@expo/metro-config@58.0.17'
  - '@expo/prebuild-config@58.0.16'
  - '@expo/router-server@58.0.17'
  - babel-preset-expo@58.0.20
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-server@58.0.6
  - expo@58.0.19
  - expo-glass-effect@58.0.5
  - expo-image@58.0.17
  - expo-router@58.0.26

# Security: transitive deps (Expo CLI / Metro / Tamagui build tooling) pinned
# to patched releases. Same-major only, so no API breakage. Remove an entry
# once the parent resolves a patched version itself (`pnpm audit` clean).
overrides:
  '@xmldom/xmldom@0.8': ^0.8.15
  '@xmldom/xmldom@0.9': ^0.9.12
  'brace-expansion@1': ^1.1.21
  'brace-expansion@5': ^5.0.12
  compression: ^1.8.2
  decode-uri-component: 0.5.0
  esbuild: ^0.28.1
  fast-uri: ^3.1.9
  'js-yaml@3': ^3.15.2
  'js-yaml@4': ^4.3.2
  'nanoid@3': ^3.3.20
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
