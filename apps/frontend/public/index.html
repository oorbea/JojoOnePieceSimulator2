<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` non-zero
         on notched phones / standalone mode, which the SafeAreaProvider insets
         rely on. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Simulador de Stands y Frutas del Diablo: JoJo x One Piece"
    />
    <!-- First-paint theme colours (OS scheme). Once the app boots,
         applyThemeColor() overwrites both with the resolved in-app theme so
         the manual light/dark toggle is respected too. Keep in sync with
         shared/lib/theme-color.ts. -->
    <meta name="theme-color" content="#00A0E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1626" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JOPS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* The app fills exactly the window it is shown in. #root is pinned to
         the viewport with `position: fixed; inset: 0` instead of a
         `100vh`/`100dvh` height on purpose: in an installed Android PWA the
         first layout resolved `dvh` to the full screen height - status bar
         included - so the whole app (and AppShell's floating bottom dock)
         hung ~one status bar below the visible window until the first
         resize, which "fixed" it. A fixed box is laid out against the real
         window (and tracks a collapsing browser address bar just as well),
         so there is nothing to correct afterwards. */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element fill the window */
      #root {
        position: fixed;
        inset: 0;
        display: flex;
      }
    </style>
  </head>
  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
