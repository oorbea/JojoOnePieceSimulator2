name: CI

on:
  push:
    branches: [develop]

# No pull_request trigger: PRs are always develop -> main from this same
# repo (no forks), so the push run on develop's SHA already satisfies the
# required status check GitHub shows on the PR - a pull_request trigger
# here would just re-run every job on the identical commit.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test + vips)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # Needed for the -tags vips build (see Dockerfile.backend and
      # apps/backend/Makefile's test-vips target) - CGO links against
      # libvips-dev here the same way the Docker builder stage does.
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config

      - name: Vet
        run: go vet ./...

      - name: Test (default build)
        run: go test ./...

      # Compiles and exercises the real libvips-backed image processor - this
      # path was never covered by CI before (see project memory:
      # cicd_picture_pipeline).
      - name: Test (-tags vips)
        env:
          CGO_ENABLED: "1"
        run: go test -tags vips ./...

  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: apps/frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:ci

  backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deployments/docker/Dockerfile.backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend-image:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build frontend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deployments/docker/Dockerfile.frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            EXPO_PUBLIC_API_URL=http://localhost:8080/api/v1
            EXPO_PUBLIC_SOCKET_URL=ws://localhost:8080/api/v1
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=ci-placeholder

  compose-config:
    name: Validate production compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Validate production compose config
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          JWT_SECRET: ci-placeholder
        run: |
          docker compose \
            -f deployments/docker-compose.yml \
            -f deployments/docker-compose.prod.yml \
            config

  ci-success:
    # Name must match the "ci-success" required status check context set in
    # branch protection exactly (GitHub reports checks by this display name,
    # not the job id).
    name: ci-success
    runs-on: ubuntu-latest
    needs: [backend, frontend, backend-image, frontend-image, compose-config]
    # Single required status check - adding/renaming jobs above never
    # requires touching branch protection settings again.
    steps:
      - run: echo ok
